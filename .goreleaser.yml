# .goreleaser.yml
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

env:
  - GO111MODULE=on
  - GOPROXY=https://proxy.golang.org

before:
  hooks:
    - go mod download

builds:
  - binary: oc-container-login
    env:
      - CGO_ENABLED=0
    # Apple's container CLI only runs on Apple silicon Macs.
    goos:
      - darwin
    goarch:
      - arm64
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    ldflags:
      - -s -w

release:
  github:
    owner: cblecker
    name: oc-container-login
  prerelease: auto
